<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cobalt is a Base UI design system for precise, keyboard-first product interfaces. Built with React, Tailwind CSS, and Vite."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("cobalt-theme");
          const theme = stored === "light" || stored === "dark" ? stored : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          document.documentElement.dataset.theme = theme;
        } catch {
          // Storage can be unavailable in locked-down browsing contexts.
        }
      })();
    </script>
    <title>Cobalt — Base UI design system</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
